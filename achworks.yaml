schemaVersion: achworks.dev/v1alpha1
kind: Foundation

metadata:
  name: achrix
  title: AChrix
  description: AChrix is an executable, reusable, versioned AChWorks Foundation for web-connected applications.

spec:
  type: application-base
  lifecycle: active
  system: achrix
  ownership: AChWorks

  capabilities:
    provides:
      - versioned-application-base
      - application-module-composition
      - application-capability-contracts
    consumes:
      - cross-project-engineering-standards
      - lifecycle-contract
      - validation-evidence-contract
      - external-effect-safety-contract

  documentation:
    path: docs/

  source:
    repository: AChWorks/achrix
    url: https://github.com/AChWorks/achrix

  extensions:
    foundation:
      family: web-connected-applications
      koinon: AChWorks/koinon
      consumption: versioned-executable
      mandatoryAtEcosystemLevel: false
