schemaVersion: achworks.dev/v1alpha1
kind: Foundation

metadata:
  name: achrix
  title: AChrix
  description: AChrix is the executable, reusable, versioned AChWorks Application Foundation for suitable web-connected and online products.

spec:
  type: application-foundation
  lifecycle: active
  system: achworks-application-ecosystem
  ownership: AChWorks

  capabilities:
    provides:
      - application-foundation
      - application-module-composition
      - application-capability-contracts
    consumes:
      - cross-project-engineering-standards
      - lifecycle-contract
      - validation-evidence-contract
      - external-effect-safety-contract

  documentation:
    path: docs/

  source:
    repository: AChWorks/achrix
    url: https://github.com/AChWorks/achrix

  extensions:
    foundation:
      family: application-online
      ecosystemPlatform: AChWorks/platform
      consumption: versioned-executable
      mandatoryAtEcosystemLevel: false
