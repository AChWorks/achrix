# SPDX-License-Identifier: MPL-2.0
name: AChrix baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      # Cache only native tools. The setup digest includes the official source
      # checksum, exact version and build options; never restore a prefix match.
      - name: Restore exact PostgreSQL validation tools
        id: postgres-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/achrix-postgres/install
          key: postgres-ubuntu-24.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-validation-postgres.sh') }}
      - name: Native validation prerequisites
        if: steps.postgres-tools.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential bison flex m4 bzip2
      - name: Exact supported PostgreSQL tools
        if: steps.postgres-tools.outputs.cache-hit != 'true'
        run: scripts/setup-validation-postgres.sh "$RUNNER_TEMP/achrix-postgres"
      - name: Foundation, isolated consumer and real PostgreSQL proof
        env:
          ACHRIX_PG_BIN: ${{ runner.temp }}/achrix-postgres/install/bin
        run: scripts/validate.sh
      # Publish only after successful full validation of trusted integrated main.
      # PRs can consume main's cache or build cold; they never publish it here.
      - name: Save verified PostgreSQL validation tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.postgres-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/achrix-postgres/install
          key: ${{ steps.postgres-tools.outputs.cache-primary-key }}
