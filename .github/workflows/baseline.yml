# SPDX-License-Identifier: MPL-2.0
name: AChrix baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Native validation prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bison flex m4 bzip2
      - name: Exact supported PostgreSQL tools
        run: scripts/setup-validation-postgres.sh "$RUNNER_TEMP/achrix-postgres"
      - name: Foundation, isolated consumer and real PostgreSQL proof
        env:
          ACHRIX_PG_BIN: ${{ runner.temp }}/achrix-postgres/install/bin
        run: scripts/validate.sh
